<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mora Admin</title>
  <style>
    :root {
      --green-900: #123d2e;
      --green-800: #184d3d;
      --green-700: #1a5f3f;
      --green-600: #2b7d56;
      --green-100: #e8f7ef;
      --white: #ffffff;
      --gray-100: #f3f5f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-500: #6b7280;
      --gray-700: #374151;
      --shadow: 0 10px 25px rgba(17, 24, 39, 0.08);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: Inter, Arial, sans-serif; background: var(--gray-100); color: var(--gray-700); }
    body { min-height: 100vh; }
    button, input { font: inherit; }
    .admin-shell {
      display: flex;
      min-height: 100vh;
      background: linear-gradient(180deg, #f5faf7 0%, #edf4ef 100%);
    }
    .sidebar {
      width: 260px;
      background: linear-gradient(180deg, var(--green-800) 0%, var(--green-700) 100%);
      color: var(--white);
      padding: 26px 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 8px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .brand-mark {
      width: 42px; height: 42px; border-radius: 50%;
      display: grid; place-items: center;
      background: rgba(255,255,255,0.12); font-weight: 800;
      font-size: 1.3rem;
    }
    .brand-text { line-height: 1.1; }
    .brand-text strong { display: block; font-size: 1.1rem; }
    .brand-text span { font-size: 0.74rem; opacity: 0.8; }
    .nav { display: flex; flex-direction: column; gap: 8px; }
    .nav-btn {
      border: 0; background: transparent; color: rgba(255,255,255,0.9);
      border-radius: 12px; padding: 12px 14px; text-align: left; font-size: 1.05rem; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; gap: 12px;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .nav-btn:hover, .nav-btn.active { background: rgba(255,255,255,0.14); }
    .nav-btn:active { transform: translateY(1px); }
    .nav-badge {
      margin-top: auto; border-radius: 16px; background: rgba(255,255,255,0.08); padding: 18px 16px; border: 1px solid rgba(255,255,255,0.08);
    }
    .nav-badge h4 { margin: 0 0 8px; font-size: 0.95rem; }
    .nav-badge .cta {
      background: var(--white); color: var(--green-700); border: 0; border-radius: 10px; padding: 10px 12px; font-weight: 700; width: 100%; cursor: pointer;
    }
    .content { flex: 1; display: flex; flex-direction: column; }
    .topbar {
      height: 82px; background: rgba(255,255,255,0.9); border-bottom: 1px solid var(--gray-200);
      display: flex; align-items: center; justify-content: space-between; padding: 0 28px;
      backdrop-filter: blur(8px);
    }
    .search-box {
      display: flex; align-items: center; gap: 10px; background: var(--gray-100); border: 1px solid var(--gray-200); border-radius: 12px; padding: 12px 16px; min-width: 360px;
    }
    .search-box input {
      border: 0; outline: none; background: transparent; width: 100%; font-size: 0.97rem; color: var(--gray-700);
    }
    .top-right { display: flex; align-items: center; gap: 16px; }
    .date-pill {
      padding: 10px 16px; border-radius: 12px; border: 1px solid var(--gray-200); background: var(--white); font-weight: 600; color: var(--gray-700);
    }
    .icon-bell {
      width: 38px; height: 38px; border-radius: 12px; background: var(--gray-100); display: grid; place-items: center; border: 1px solid var(--gray-200);
    }
    .user-chip {
      display: flex; align-items: center; gap: 12px; background: var(--white); border: 1px solid var(--gray-200); border-radius: 12px; padding: 8px 12px;
    }
    .avatar {
      width: 36px; height: 36px; background: linear-gradient(135deg, #f6d365, #fda085); border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: var(--green-900);
    }
    .main { padding: 28px; }
    .page-title h1 { margin: 0; font-size: 2.2rem; line-height: 1.1; }
    .page-title p { margin: 8px 0 0; color: var(--gray-500); font-size: 1.08rem; }
    .actions-row { display: flex; justify-content: flex-end; margin-top: 14px; }
    .pill {
      border: 1px solid var(--gray-200); background: var(--white); color: var(--gray-700); border-radius: 12px; padding: 10px 16px; font-weight: 600; cursor: pointer;
    }
    .cards {
      margin-top: 26px; display: grid; grid-template-columns: repeat(4, minmax(180px, 1fr)); gap: 18px;
    }
    .card {
      background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 20px 18px; box-shadow: var(--shadow);
    }
    .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .card-icon {
      width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-size: 1.2rem; background: var(--green-100); color: var(--green-700);
    }
    .card-value { font-size: clamp(1.8rem, 2vw, 2.2rem); font-weight: 800; margin: 0 0 8px; }
    .trend { color: var(--gray-500); font-size: 0.85rem; }
    .trend.up { color: #259a6f; }
    .trend.down { color: #d9534f; }
    .panel {
      margin-top: 28px; background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
    }
    .panel-header {
      display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--gray-200);
    }
    .panel-header h3 { margin: 0; font-size: 1.15rem; }
    .panel-actions { display: flex; gap: 10px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 16px 18px; border-bottom: 1px solid var(--gray-200); text-align: left; }
    th { background: #edf4ef; color: var(--gray-700); font-size: 0.87rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
    tr:last-child td { border-bottom: 0; }
    .status {
      display: inline-flex; align-items: center; justify-content: center; padding: 7px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
    }
    .status.delivered { background: #dff7ea; color: #1e8f5c; }
    .status.pending { background: #fff4db; color: #bc7d00; }
    .status.cancelled { background: #fde2e2; color: #c13d3d; }
    .row-actions { display: flex; gap: 8px; }
    .row-actions button {
      border: 1px solid var(--gray-200); background: var(--white); border-radius: 8px; padding: 7px 9px; cursor: pointer;
    }
    .hidden { display: none !important; }
    .login-screen {
      min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, #edf7ee 0%, #dfeee7 100%);
      padding: 24px;
    }
    .login-box {
      width: min(420px, 92vw); background: rgba(255,255,255,0.88); border: 1px solid var(--gray-200); border-radius: 24px; box-shadow: var(--shadow); padding: 28px 26px;
      backdrop-filter: blur(10px);
    }
    .login-box h1 { margin: 0 0 4px; font-size: 2rem; color: var(--green-800); }
    .login-box p { margin: 0 0 24px; color: var(--gray-500); }
    .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .field label { font-size: 0.86rem; font-weight: 700; color: var(--gray-700); }
    .field input {
      border: 1px solid var(--gray-300); border-radius: 12px; padding: 12px 14px; background: white; outline: none;
    }
    .field input:focus { border-color: var(--green-600); box-shadow: 0 0 0 3px rgba(26,95,63,0.12); }
    .primary-btn {
      width: 100%; border: 0; border-radius: 12px; background: linear-gradient(180deg, var(--green-700) 0%, var(--green-600) 100%); color: white; font-weight: 700; padding: 12px 16px; cursor: pointer;
    }
    .logger { margin-top: 14px; font-size: 0.83rem; color: var(--gray-500); min-height: 20px; }
    .logger.error { color: #c13d3d; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .small-btn { background: var(--green-100); color: var(--green-800); border: 1px solid rgba(26,95,63,0.2); border-radius: 10px; padding: 8px 10px; cursor: pointer; font-weight: 700; }
    .form-row { display:flex; gap:12px; margin-top: 12px; }
    .muted { color: var(--gray-500); font-size: 0.88rem; }
    @media (max-width: 980px) {
      .admin-shell { flex-direction: column; }
      .sidebar { width: 100%; }
      .cards { grid-template-columns: repeat(2, minmax(180px, 1fr)); }
      .search-box { min-width: 0; width: 100%; }
      .topbar { flex-wrap: wrap; gap: 12px; padding: 14px 18px; height: auto; }
    }
    @media (max-width: 640px) {
      .cards { grid-template-columns: 1fr; }
      .panel-header { flex-direction: column; align-items: flex-start; gap: 10px; }
      .topbar { flex-direction: column; align-items: stretch; }
      .top-right { justify-content: space-between; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="../admin.js"></script>
</body>
</html>
